name: News-Kalender aktualisieren

on:
  schedule:
    - cron: "0 6 * * 0"
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_calendar.py
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.ics
          git diff --cached --quiet || git commit -m "News-Kalender $(date -u +%F)"
          git push
